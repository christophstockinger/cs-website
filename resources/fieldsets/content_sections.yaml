title: Inhaltsabschnitte
fields:
  -
    handle: sections
    field:
      type: grid
      display: Abschnitte
      instructions: 'Je ein Block aus Überschrift und Text, in beliebiger Anzahl und Reihenfolge.'
      mode: stacked
      add_row: 'Abschnitt hinzufügen'
      reorderable: true
      localizable: true
      fields:
        -
          handle: heading
          field:
            type: text
            display: Überschrift
            validate:
              - required
        -
          handle: text
          field:
            type: markdown
            display: Text
            buttons:
              - bold
              - italic
              - unorderedlist
              - orderedlist
              - link
            validate:
              - required
