title: Marke
fields:
  -
    handle: logo
    field:
      type: assets
      display: Logo
      instructions: 'SVG-Datei. Wird im Frontend inline eingebunden — im SVG `fill="currentColor"` verwenden, damit Textfarbe und Hover greifen. Der Alt-Text der Datei dient als Beschriftung des Logo-Links.'
      container: assets
      folder: brand
      max_files: 1
      mode: list
      allow_uploads: true
      validate:
        - required
  -
    handle: brand_name
    field:
      type: text
      display: Name
      instructions: 'Für die Copyright-Zeile.'
      validate:
        - required
