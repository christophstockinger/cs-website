title: Button
fields:
  -
    handle: button
    field:
      type: group
      display: Button
      collapsible: true
      fullscreen: false
      sortable: false
      duplicate: false
      fields:
        -
          handle: label
          field:
            type: text
            localizable: true
            listable: false
            display: Label
            replicator_preview: false
        -
          handle: link_type
          field:
            options:
              -
                key: entry
                value: Entry
              -
                key: url
                value: URL
              -
                key: email
                value: Email
              -
                key: tel
                value: Tel
              -
                key: sms
                value: SMS
              -
                key: asset
                value: Asset
            type: button_group
            localizable: true
            listable: false
            display: Link-Typ
            replicator_preview: false
            always_save: false
        -
          handle: entry
          field:
            max_items: 1
            type: entries
            localizable: true
            width: 50
            listable: false
            display: Entry
            replicator_preview: false
            if:
              link_type: entry
            collections:
              - pages
              - landingpages
              - leistungen
              - blog
            create: false
            validate:
              - 'required_if:link_type,entry'
        -
          handle: url
          field:
            placeholder: 'https://site.com'
            input_type: url
            type: text
            localizable: true
            listable: false
            display: URL
            width: 50
            if:
              link_type: url
            validate:
              - 'required_if:link_type,url'
        -
          handle: email
          field:
            placeholder: info@site.com
            input_type: email
            type: text
            localizable: true
            listable: false
            display: E-Mail
            width: 50
            replicator_preview: false
            if:
              link_type: email
            validate:
              - 'required_if:link_type,email'
        -
          handle: tel
          field:
            placeholder: '+0 (0)12 345678'
            input_type: tel
            type: text
            localizable: true
            listable: false
            display: Telefon
            width: 50
            replicator_preview: false
            if:
              link_type: tel
            validate:
              - 'required_if:link_type,tel'
        -
          handle: asset
          field:
            container: assets
            max_files: 1
            min_files: 1
            type: assets
            display: Asset
            width: 50
            if:
              link_type: 'equals asset'
            validate:
              - 'required_if:link_type,asset'
        -
          handle: sms
          field:
            placeholder: '+0 (0)12 345678'
            input_type: tel
            type: text
            localizable: true
            listable: false
            display: SMS
            width: 50
            replicator_preview: false
            if:
              link_type: sms
            validate:
              - 'required_if:link_type,sms'
        -
          handle: target_blank
          field:
            type: toggle
            localizable: true
            width: 50
            listable: false
            display: 'Open in new window'
            replicator_preview: false
        -
          handle: attr_title
          field:
            placeholder: 'Learn more'
            type: text
            localizable: true
            listable: false
            display: Title-Attribute
            width: 50
            replicator_preview: false
        -
          handle: attr_aria
          field:
            placeholder: 'Download the PDF'
            type: text
            localizable: true
            listable: false
            display: 'Aria label'
            width: 50
            replicator_preview: false
        -
          handle: tracker_event
          field:
            type: text
            localizable: true
            listable: false
            placeholder: my-custom-event
            display: 'Tracker event'
            instructions: 'Add the name of the event you want to be fired on click. These events only fire on a production environment. Allowed: `A-Z`, `a-z`, `0-9`, `-`, `_`.'
            validate:
              - 'regex:/[A-Za-z0-9_\-]+$/'
            instructions_position: below
            width: 50
            replicator_preview: false
            if:
              label: 'custom tracker_events'
