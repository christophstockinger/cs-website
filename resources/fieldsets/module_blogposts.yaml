title: 'Module: Blogbeiträge'
fields:
  -
    handle: headline
    field:
      type: text
      display: Überschrift
      sortable: false
      duplicate: false
      actions: false
      validate:
        - required
  -
    handle: blogpost_count
    field:
      min: 1
      step: 1
      default: '3'
      type: integer
      display: 'Anzahl Blogposts'
      width: 50
      sortable: false
      replicator_preview: false
      duplicate: false
      actions: false
  -
    handle: show_overview_link
    field:
      inline_label: Anzeigen
      inline_label_when_true: Ausblenden
      type: toggle
      display: 'Link zur Übersichtsseite anzeigen'
      width: 50
      sortable: false
      replicator_preview: false
      duplicate: false
      actions: false
