title: Blogbeiträge
tabs:
  main:
    display: Hauptbereich
    sections:
      -
        fields:
          -
            handle: title
            field:
              type: text
              required: true
              validate:
                - required
              display: Titel
          -
            handle: image
            field:
              container: assets
              folder: blogposts
              restrict: true
              max_files: 1
              min_files: 1
              type: assets
              display: Bild
              sortable: false
              replicator_preview: false
              duplicate: false
              actions: false
          -
            handle: content
            field:
              buttons:
                - h2
                - h3
                - bold
                - italic
                - unorderedlist
                - orderedlist
                - removeformat
                - anchor
                - underline
                - strikethrough
                - superscript
                - subscript
                - alignleft
                - aligncenter
                - alignright
                - alignjustify
              link_noopener: true
              link_noreferrer: true
              target_blank: true
              link_collections:
                - pages
                - blogposts
              container: assets
              remove_empty_nodes: trim
              type: bard
              display: Inhalt
              hide_display: true
              sortable: false
              replicator_preview: false
              duplicate: false
              actions: false
  sidebar:
    display: Sidebar
    sections:
      -
        fields:
          -
            handle: slug
            field:
              type: slug
              localizable: true
              validate: 'max:200'
          -
            handle: date
            field:
              type: date
              required: true
              default: now
              validate:
                - required
