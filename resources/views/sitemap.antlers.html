<?xml version="1.0" encoding="UTF-8"?>
<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9">
{{ collection:pages }}
{{ unless seo_noindex }}
    <url>
        <loc>{{ permalink }}</loc>
        <lastmod>{{ updated_at format="Y-m-d" }}</lastmod>
        <changefreq>{{ if url == "/" }}weekly{{ else }}yearly{{ /if }}</changefreq>
        <priority>{{ if url == "/" }}1.0{{ else }}0.5{{ /if }}</priority>
    </url>
{{ /unless }}
{{ /collection:pages }}
</urlset>
