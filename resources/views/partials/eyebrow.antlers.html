{{# Versal-Label mit Signal-Marke, über den großen Überschriften. #}}
{{ if eyebrow }}
    <p class="flex items-center gap-2.5 text-label text-signal uppercase md:gap-3">
        <span class="block h-3 w-2 -skew-x-30 bg-signal md:h-3.5 md:w-2.5" aria-hidden="true"></span>
        <span>{{ eyebrow }}</span>
    </p>
{{ /if }}
